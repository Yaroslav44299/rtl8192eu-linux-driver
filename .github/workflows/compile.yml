name: Build Driver for Luckfox
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Cross-Compiler
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-linux-gnueabihf make git

      - name: Fetch Kernel Headers Only
        run: |
          mkdir ~/luckfox && cd ~/luckfox
          git init
          git remote add origin https://github.com
          git config core.sparseCheckout true
          echo "sysdrv/source/kernel/*" >> .git/info/sparse-checkout
          git pull --depth 1 origin main

      - name: Prepare Kernel Config
        run: |
          cd ~/luckfox/sysdrv/source/kernel
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- luckfox_pico_defconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules_prepare

      - name: Compile Driver
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -C ~/luckfox/sysdrv/source/kernel M=$(pwd) modules

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: luckfox-driver
          path: "*.ko"
