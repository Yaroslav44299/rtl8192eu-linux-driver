name: Build Driver for Luckfox
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Download Deb Package
        run: |
          curl -L "https://kernel.org" -o dkms-package.deb
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: luckfox-driver
          path: dkms-package.deb
