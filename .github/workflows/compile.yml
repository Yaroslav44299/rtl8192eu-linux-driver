name: Build Driver for Luckfox
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Cross-Compiler
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-linux-gnueabihf make git wget unzip
      - name: Download Luckfox Kernel Headers
        run: |
          git clone --depth 1 https://github.com ~/luckfox
      - name: Compile Driver
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -C ~/luckfox/sysdrv/source/kernel M=$(pwd) modules
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: luckfox-driver
          path: "*.ko"
