name: Build Driver for Luckfox
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Cross-Compiler
        run: |
          sudo apt update && sudo apt install -y gcc-arm-linux-gnueabihf make git
      - name: Fetch Minimal Kernel Source
        run: |
          git clone --depth 1 --branch luckfox-pico https://github.com ~/luckfox-kernel
      - name: Prepare Kernel Config
        run: |
          cd ~/luckfox-kernel
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- luckfox_pico_defconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules_prepare
      - name: Compile Driver
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -C ~/luckfox-kernel M=$(pwd) modules
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: luckfox-driver
          path: 8192eu.ko
