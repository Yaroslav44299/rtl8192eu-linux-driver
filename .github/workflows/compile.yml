name: Build Driver for Luckfox
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Cross-Compiler
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-linux-gnueabihf make git

      - name: Create Dummy Kernel Tree
        run: |
          mkdir -p ~/dummy-kernel/arch/arm/include
          mkdir -p ~/dummy-kernel/include/linux
          touch ~/dummy-kernel/include/linux/kconfig.h
          echo "obj-m += rtl8192eu.o" > ~/dummy-kernel/Makefile

      - name: Compile Driver
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -C . M=$(pwd) modules

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: luckfox-driver
          path: "*.ko"
